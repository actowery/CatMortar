name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet restore CatMortar.slnx --locked-mode
      - run: dotnet build Source/CatMortar/CatMortar.csproj -c Release --no-restore
      - run: pwsh ./scripts/validate-package.ps1 -RequireBinaries
      - run: pwsh ./scripts/package.ps1
      - run: gh release create "${{ inputs.tag }}" outputs/CatMortar.zip outputs/CatMortar.zip.sha256 --generate-notes --title "Cat Mortar ${{ inputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
