name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and coverage (${{ matrix.flag }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - rimworld: "1.6"
            flag: rw16
          - rimworld: "1.7"
            flag: rw17
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet restore CatMortar.slnx --locked-mode
      - run: dotnet build Source/CatMortar/CatMortar.csproj -c Release --no-restore
      - run: dotnet test Tests/CatMortar.Tests/CatMortar.Tests.csproj -c Release --no-restore /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:CoverletOutput=../../TestResults/${{ matrix.rimworld }}/coverage
      - run: pwsh ./scripts/validate-package.ps1 -RequireBinaries
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: TestResults/${{ matrix.rimworld }}/coverage.cobertura.xml
          flags: ${{ matrix.flag }}
          fail_ci_if_error: true
          use_oidc: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CatMortar-${{ matrix.rimworld }}
          path: ${{ matrix.rimworld }}/Assemblies/CatMortar.dll
          if-no-files-found: error

  build:
    name: Dual-version build and package validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet restore CatMortar.slnx --locked-mode
      - run: dotnet build Source/CatMortar/CatMortar.csproj -c Release --no-restore
      - run: pwsh ./scripts/validate-package.ps1 -RequireBinaries

  package:
    name: Release archive
    needs: [build, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet restore CatMortar.slnx --locked-mode
      - run: dotnet build Source/CatMortar/CatMortar.csproj -c Release --no-restore
      - run: pwsh ./scripts/package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CatMortar-release
          path: |
            outputs/CatMortar.zip
            outputs/CatMortar.zip.sha256
          if-no-files-found: error
