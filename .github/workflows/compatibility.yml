name: RimWorld 1.7 compatibility canary

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-canary
  cancel-in-progress: true

jobs:
  latest-unstable-reference:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: >-
          dotnet add Source/CatMortar/CatMortar.csproj package Krafs.Rimworld.Ref
          --prerelease --framework net10.0
      - run: dotnet build Source/CatMortar/CatMortar.csproj --configuration Release --framework net10.0
      - run: dotnet test Tests/CatMortar.Tests/CatMortar.Tests.csproj --configuration Release
